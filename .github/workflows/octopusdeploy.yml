name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "ERROR: DOCKER_USERNAME secret is missing"
            exit 1
          fi

          if [ -z "$DOCKER_PASSWORD" ]; then
            echo "ERROR: DOCKER_PASSWORD secret is missing"
            exit 1
          fi

          echo "Docker credentials are configured"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t naresh2546/todo-list-app:latest \
            -f ./Todo-App/Dockerfile \
            ./Todo-App

      - name: Push Docker Image
        run: |
          docker push naresh2546/todo-list-app:latest