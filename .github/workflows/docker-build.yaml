name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker username
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$naresh2546" ]; then
            echo "DOCKER_USERNAME is configured"
            exit 1
          fi


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.naresh2546 }}
          password: ${{ secrets.dockerfilesecret }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/todo-list-app:latest .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/todo-list-app:latest