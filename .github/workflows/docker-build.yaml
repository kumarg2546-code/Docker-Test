
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.naresh2546 }}
          password: ${{ secrets.DOCKERFILESECRET }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.naresh2546 }}/todo-list-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.naresh2546 }}/todo-list-app:latest