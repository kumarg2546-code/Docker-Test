# 1. Choose the base operating system or runtime environment
FROM node:20-alpine

# 2. Set the working directory inside the container
WORKDIR /app

# 3. Copy dependency files first (to optimize build caching)
COPY package*.json ./

# 4. Run commands to install dependencies during the build phase
RUN npm install

# 5. Copy the rest of your application source code
COPY . .

# 6. Inform Docker which port the container listens on at runtime
EXPOSE 3000

# 7. Define the default command that executes when the container starts
CMD ["npm", "start"]