name: Build and Push Docker Image

# This triggers the workflow every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up QEMU (Optional, useful for multi-platform builds)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 3: Set up Docker Buildx (Enables modern BuildKit features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to Docker Hub using the secrets configured earlier
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build the Docker image and push it to Docker Hub
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-dockerhub-username' and 'your-repo-name' with your actual details
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/your-repo-name:${{ github.sha }}
